name: builds

# Desktop test builds (ARCHITECTURE.md §9.3 in its pre-release form). Godot 4 cannot export a C# project to the
# web, so there is no browser build; every push to main instead produces Windows, Linux and macOS zips as
# workflow artifacts and refreshes the rolling "nightly" pre-release so the download links stay put.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
      - name: build libraries
        run: dotnet build CompanyWars.sln --configuration Release
      - name: pack content, schema and manifest into the resource pack
        run: mkdir -p game/data && cp -r content schema manifest game/data/
      - name: import
        run: godot --headless --path game --import
      - name: export
        run: |
          set -e
          mkdir -p build/linux build/windows build/macos
          godot --headless --path game --export-release "Linux" ../build/linux/CompanyWars.x86_64
          godot --headless --path game --export-release "Windows" ../build/windows/CompanyWars.exe
          godot --headless --path game --export-release "macOS" ../build/macos/CompanyWars.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - name: debug keystore and editor settings for the Android export
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/keystores"
          # Godot's import step may already have generated a debug keystore here; keep it if so.
          [ -f "$HOME/.local/share/godot/keystores/debug.keystore" ] || \
            keytool -genkeypair -v -keystore "$HOME/.local/share/godot/keystores/debug.keystore" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.local/share/godot/keystores/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: export Android (debug-signed, arm64)
        run: |
          set -e
          mkdir -p build/android
          godot --headless --path game --export-debug "Android" ../build/android/CompanyWars.apk
          cp build/android/CompanyWars.apk build/CompanyWars-android.apk
          ls -la build/android
      - name: zip
        run: |
          set -e
          cd build && cp macos/CompanyWars.zip CompanyWars-macos.zip && zip -qr CompanyWars-linux.zip linux && zip -qr CompanyWars-windows.zip windows
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-linux
          path: build/CompanyWars-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-windows
          path: build/CompanyWars-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-macos
          path: build/CompanyWars-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-android
          path: build/CompanyWars-android.apk
      - name: refresh the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly greybox build
          prerelease: true
          body: |
            Automated desktop builds of the latest `main`. Greybox: every sprite is a placeholder at its final size.
            Windows: unzip and run CompanyWars.exe. Linux: unzip, `chmod +x CompanyWars.x86_64`, run.
            macOS: unsigned; right-click → Open the first time.
            Android: a debug-signed APK for sideloading (C# on Android is experimental in Godot 4.7). Allow
            installs from your browser or file manager, open the APK, then launch Company Wars; landscape.
          files: |
            build/CompanyWars-linux.zip
            build/CompanyWars-windows.zip
            build/CompanyWars-macos.zip
            build/CompanyWars-android.apk
