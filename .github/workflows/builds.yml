name: builds

# Desktop test builds (ARCHITECTURE.md §9.3 in its pre-release form). Godot 4 cannot export a C# project to the
# web, so there is no browser build; every push to main instead produces Windows, Linux and macOS zips as
# workflow artifacts and refreshes the rolling "nightly" pre-release so the download links stay put.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
      - name: build libraries
        run: dotnet build CompanyWars.sln --configuration Release
      - name: import
        run: godot --headless --path game --import
      - name: export
        run: |
          set -e
          mkdir -p build/linux build/windows build/macos
          godot --headless --path game --export-release "Linux" ../build/linux/CompanyWars.x86_64
          godot --headless --path game --export-release "Windows" ../build/windows/CompanyWars.exe
          godot --headless --path game --export-release "macOS" ../build/macos/CompanyWars.zip
      - name: content and manifest ride beside the executable
        # The libraries read content/ and manifest/ by path in development (ARCHITECTURE.md §2); the export
        # carries them next to the binary until the resource-pack loader lands with the release pipeline.
        run: |
          set -e
          for d in linux windows; do
            cp -r content schema manifest build/$d/
          done
          cd build/macos && unzip -q CompanyWars.zip && rm CompanyWars.zip
          app=$(ls -d *.app | head -1)
          mkdir -p "$app/Contents/Resources"
          cp -r ../../content ../../schema ../../manifest "$app/Contents/Resources/"
          zip -qr ../CompanyWars-macos.zip "$app"
          cd .. && zip -qr CompanyWars-linux.zip linux && zip -qr CompanyWars-windows.zip windows
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-linux
          path: build/CompanyWars-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-windows
          path: build/CompanyWars-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompanyWars-macos
          path: build/CompanyWars-macos.zip
      - name: refresh the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly greybox build
          prerelease: true
          body: |
            Automated desktop builds of the latest `main`. Greybox: every sprite is a placeholder at its final size.
            Windows: unzip and run CompanyWars.exe. Linux: unzip, `chmod +x CompanyWars.x86_64`, run.
            macOS: unsigned; right-click → Open the first time.
          files: |
            build/CompanyWars-linux.zip
            build/CompanyWars-windows.zip
            build/CompanyWars-macos.zip
